name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
      - 'requirements.txt'
      - '.pre-commit-config.yaml'

jobs:
  lint:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run docs linter
        run: python scripts/lint_docs.py --all --strict

      - name: Check terminology
        run: python scripts/check_terminology.py --all

      - name: Check internal links
        run: python scripts/check_links.py --internal --all

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build docs (strict mode)
        run: mkdocs build --strict

  check-external-links:
    name: Check external links
    runs-on: ubuntu-latest
    needs: build
    # Run on PRs to main only, not on every push (slow)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check external links
        run: python scripts/check_links.py --external --all --timeout 15 --retry 2
        continue-on-error: true  # Warn but don't block on transient external failures
